# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: pagesmith
site_url: https://andgineer.github.io/pagesmith
site_author: Andrey Sorokin

# Repository
repo_name: pagesmith
repo_url: https://github.com/andgineer/pagesmith
edit_uri: edit/master/docs
docs_dir: 'src/LANGUAGE'
site_dir: 'SITE_DIR'

plugins:
  - awesome-pages
  - search:
      lang: LANGUAGE
  - mkdocstrings:
        handlers:
          python:
            options:
              show_root_heading: true

markdown_extensions:
  - abbr
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: docs/includes
  - admonition

extra:
  alternate:
    - name: English
      link: /pagesmith/
      lang: en
    - name: Русский
      link: /pagesmith/ru/
      lang: ru

nav:
  - index.md
  - html_splitter.md
  - text_splitter.md
